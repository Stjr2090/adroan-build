name: identity-gate

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run identity/secret gate
        env:
          SCAN_PR_TITLE: ${{ github.event.pull_request.title || '' }}
          SCAN_PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: bash scripts/check-identity.sh
